<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singing Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Beth+Ellen&family=Mynerve&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
  /* slightly larger hero landmark on this page */
  .page-hero img { height: min(178px, 40vw); }
  /* raise the landmark higher on the page */
  .page-hero { margin-top: 16px; }

  /* ── VIDEO REEL (coverflow carousel) ── */
  .page-wrap { padding-bottom: 18px; }
  .reel {
    display: flex; gap: 2.5vw;
    overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 20px 0 8px;
    padding-inline: calc(50% - min(38vw, 280px));   /* lets first/last centre */
  }
  .reel::-webkit-scrollbar { display: none; }
  .reel-card {
    flex: 0 0 min(76vw, 560px);
    scroll-snap-align: center;
    transform-origin: center center;
    will-change: transform, opacity;
  }
  .reel-frame {
    position: relative; aspect-ratio: 16 / 9;
    background: var(--parchment-dark);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(42,33,24,0.18);
  }
  .reel-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .reel-ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-style: italic; color: var(--ink-faint); font-size: 14px; text-align: center; padding: 14px;
  }
  /* veil blocks the iframe from swallowing swipes on side cards, and taps
     to bring a card to the centre; removed on the centre card so it plays */
  .reel-veil { position: absolute; inset: 0; z-index: 2; cursor: pointer; background: transparent; }
  .reel-veil.open { pointer-events: none; }
  .reel-cap { margin-top: 14px; text-align: center; padding: 0 8px; }
  .reel-title { font-family: 'Beth Ellen', cursive; font-size: clamp(17px, 2.4vw, 22px); margin-bottom: 6px; }
  .reel-text { font-size: clamp(13px, 1.6vw, 15px); color: var(--ink-light); font-style: italic; line-height: 1.7; max-width: 500px; margin: 0 auto; }
  .reel-dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0 44px; }
  .reel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dashed); border: none; padding: 0; cursor: pointer; transition: background .25s, transform .25s; }
  .reel-dot.active { background: var(--ink); transform: scale(1.4); }
</style>
</head>
<body>
<div id="zoom-overlay"></div>

<a class="return-map" href="index.html">
  <img src="assets/map/compass.svg" alt="back to map" onerror="this.style.display='none'">
  <span class="rm-lbl">back to map</span>
</a>

<div class="page-wrap">
  <div class="page-hero">
    <img src="assets/landmarks/singinghollow.svg" alt="Singing Hollow" onerror="this.style.display='none'">
    <h1>singing hollow</h1>
    <p class="sub">every note echoes through the pines here</p>
  </div>
  <div class="ink-divider"></div>

  <p class="body-text" style="text-align:center;max-width:440px;margin:0 auto 4px;font-size:clamp(13px,1.6vw,15px);">
    swipe through — the one in the middle plays
  </p>
</div><!-- /page-wrap -->

<!-- ── VIDEO REEL ──
     Add videos in the VIDEOS array in the script at the bottom of this
     file: the YouTube id, a title, and a caption/short write-up. ── -->
<div class="reel" id="reel"></div>
<div class="reel-dots" id="reelDots"></div>

<!-- Northwest → Pigeon's Peak (singing hollow is top-right; peak is top-center = northwest) -->
<a class="nav-arrow northwest" href="about.html">
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="f1"><feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
    <path d="M34 34 C24 24, 14 14, 5 5" stroke="#2a2118" stroke-width="1.5" stroke-linecap="round" filter="url(#f1)"/>
    <path d="M5 19 C5 11, 5 5, 19 5" stroke="#2a2118" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#f1)"/>
  </svg>
  <span class="arrow-lbl">pigeon's peak</span>
</a>

<!-- Southwest → Frog Pond -->
<a class="nav-arrow southwest" href="community.html">
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="f2"><feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
    <path d="M34 6 C24 16, 14 26, 5 35" stroke="#2a2118" stroke-width="1.5" stroke-linecap="round" filter="url(#f2)"/>
    <path d="M5 21 C5 29, 5 35, 19 35" stroke="#2a2118" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#f2)"/>
  </svg>
  <span class="arrow-lbl">frog pond</span>
</a>

<!-- West → Faraway Tree -->
<a class="nav-arrow west" href="blog.html">
  <svg width="48" height="32" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="f3"><feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="15" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
    <path d="M44 16 C32 15.5, 20 16.5, 4 16" stroke="#2a2118" stroke-width="1.5" stroke-linecap="round" filter="url(#f3)"/>
    <path d="M14 7 C8 11, 3 16, 14 25" stroke="#2a2118" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#f3)"/>
  </svg>
  <span class="arrow-lbl">faraway tree</span>
</a>

<script>
  // ── VIDEO REEL ──────────────────────────────────────────────────
  // Add each video here. `id` is the YouTube id — the part after
  // youtube.com/watch?v=  (or youtu.be/ ). `title` + `caption` show
  // below the video. Add as many as you like.
  const VIDEOS = [
    { id: '', title: 'a title for this one', caption: 'something about this performance — loose and honest' },
    { id: '', title: 'another one',          caption: 'whose song, and what it means to you' },
    { id: '', title: 'an original',          caption: 'entirely yours — something grown in the hollow' },
  ];

  const reel = document.getElementById('reel');
  const dotsWrap = document.getElementById('reelDots');
  const ytSrc = id => `https://www.youtube-nocookie.com/embed/${id}?enablejsapi=1&rel=0&playsinline=1`;
  const cards = () => [...reel.querySelectorAll('.reel-card')];

  function buildReel() {
    reel.innerHTML = ''; dotsWrap.innerHTML = '';
    VIDEOS.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'reel-card';

      const frame = document.createElement('div');
      frame.className = 'reel-frame';
      if (v.id) {
        const f = document.createElement('iframe');
        f.src = ytSrc(v.id);
        f.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        f.allowFullscreen = true;
        f.loading = 'lazy';
        frame.appendChild(f);
      } else {
        const ph = document.createElement('div');
        ph.className = 'reel-ph';
        ph.textContent = 'add a YouTube id in the VIDEOS list';
        frame.appendChild(ph);
      }
      const veil = document.createElement('div');
      veil.className = 'reel-veil';
      veil.addEventListener('click', () => scrollToCard(i));
      frame.appendChild(veil);

      const cap = document.createElement('div');
      cap.className = 'reel-cap';
      const t = document.createElement('div'); t.className = 'reel-title'; t.textContent = v.title || '';
      const c = document.createElement('div'); c.className = 'reel-text';  c.textContent = v.caption || '';
      cap.appendChild(t); cap.appendChild(c);

      card.appendChild(frame); card.appendChild(cap);
      reel.appendChild(card);

      const dot = document.createElement('button');
      dot.className = 'reel-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'go to video ' + (i + 1));
      dot.addEventListener('click', () => scrollToCard(i));
      dotsWrap.appendChild(dot);
    });
  }

  function pauseCard(card) {
    const f = card.querySelector('iframe');
    if (f && f.contentWindow) {
      f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    }
  }

  let centre = -1;
  function updateReel() {
    const mid = window.innerWidth / 2, list = cards();
    let best = 0, bestD = Infinity;
    list.forEach((card, i) => {
      const r = card.getBoundingClientRect();
      const c = r.left + r.width / 2;
      const s = Math.max(-1, Math.min(1, (c - mid) / (window.innerWidth * 0.5)));
      const t = 1 - Math.min(1, Math.abs(s));               // 1 at centre → 0 far
      const scale = 0.82 + 0.18 * t;                         // centre biggest
      card.style.transform = `perspective(1100px) rotateY(${(-s * 20).toFixed(1)}deg) scale(${scale.toFixed(3)})`;
      card.style.opacity = (0.4 + 0.6 * t).toFixed(3);
      const d = Math.abs(c - mid);
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best !== centre) {
      list.forEach((card, i) => {
        card.querySelector('.reel-veil')?.classList.toggle('open', i === best);
        if (i !== best) pauseCard(card);                    // stop the video you swiped away from
      });
      dotsWrap.querySelectorAll('.reel-dot').forEach((d, i) => d.classList.toggle('active', i === best));
      centre = best;
    }
  }

  function scrollToCard(i) {
    const card = cards()[i]; if (!card) return;
    const r = card.getBoundingClientRect();
    reel.scrollBy({ left: (r.left + r.width / 2) - window.innerWidth / 2, behavior: 'smooth' });
  }

  let ticking = false;
  reel.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateReel(); });
  });
  window.addEventListener('resize', updateReel);

  buildReel();
  requestAnimationFrame(updateReel);
</script>
<script src="assets/js/nav.js"></script>
</body>
</html>
