<script>
  // ── YOUR VIDEOS ─────────────────────────────────────────────────
  // To add a video, add ONE new line to a list below. Two ways:
  //   • just paste the link in quotes:          'https://youtu.be/XXXXXXXXXXX',
  //   • or a link with a title + caption:        { url: 'https://youtu.be/XXXXXXXXXXX', title: 'my title', caption: 'a few words' },
  // Any YouTube link works — watch?v=… , youtu.be/… , or /shorts/… .
  // Add as many as you like; each row loops no matter how many there are.
  //
  // WIDE  = normal landscape videos.   REELS = vertical shorts/reels.
  const WIDE = [
    { url: 'https://www.youtube.com/watch?v=OjV0qW-Cwcs', title: 'Get You - Daniel Caesar', caption: 'how i sound when i feel free' },
    { url: 'https://www.youtube.com/watch?v=zvSH7wFrjcc&list=RDzvSH7wFrjcc&start_radio=1', title: 'Misty - Ella Fitzgerald',          caption: 'one of my favourite songs in the world' },
    { url: 'https://www.youtube.com/watch?v=foIGoBTrhJk', title: 'Valentine - Laufey',          caption: 'jazz but cute' },
    // { url: 'https://youtu.be/XXXXXXXXXXX', title: 'a new one', caption: 'say something about it' },
  ];
  const REELS = [
    { url: '', title: 'a little reel', caption: 'a short vertical moment' },
    { url: '', title: 'another reel',  caption: 'a snippet, a sketch, a scene' },
    { url: '', title: 'one more',      caption: 'quick and vertical' },
    // 'https://www.youtube.com/shorts/XXXXXXXXXXX',
  ];

  const ytSrc = id => `https://www.youtube-nocookie.com/embed/${id}?enablejsapi=1&rel=0&playsinline=1`;

  // Pull the 11-char video id out of any YouTube link (or a bare id).
  function parseId(input) {
    if (!input) return '';
    input = String(input).trim();
    const m = input.match(/(?:youtu\.be\/|\/embed\/|\/shorts\/|[?&]v=)([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(input)) return input;   // already just an id
    return '';
  }
  // Accept a plain link string OR a { url/id, title, caption } object.
  function normalize(v) {
    if (typeof v === 'string') return { id: parseId(v), title: '', caption: '' };
    return { id: parseId(v.url || v.id || ''), title: v.title || '', caption: v.caption || '' };
  }

  // A continuous coverflow: cards are absolutely positioned around a
  // fractional centre index `pos`; wrap() makes the distance loop, so
  // there's no first or last — it spins forever in either direction.
  function coverflow(root, cap, rawItems) {
    const items = (rawItems || []).map(normalize);
    const N = items.length;
    if (!N) return;
    const portrait = root.classList.contains('cf-tall');
    if (cap) cap.innerHTML = '<div class="t"></div><div class="d"></div>';

    const viewport = document.createElement('div'); viewport.className = 'cf-viewport';
    const stage = document.createElement('div'); stage.className = 'cf-stage';
    viewport.appendChild(stage);

    const cards = items.map((it, i) => {
      const card = document.createElement('div');
      card.className = 'cf-card'; card.dataset.i = i;
      const frame = document.createElement('div'); frame.className = 'cf-frame';
      if (it.id) {
        const f = document.createElement('iframe');
        f.src = ytSrc(it.id);
        f.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        f.allowFullscreen = true; f.loading = 'lazy';
        frame.appendChild(f);
      } else {
        const ph = document.createElement('div'); ph.className = 'cf-ph';
        ph.textContent = 'add a YouTube id'; frame.appendChild(ph);
      }
      const veil = document.createElement('div'); veil.className = 'cf-veil';
      frame.appendChild(veil);
      const deco = document.createElement('div'); deco.className = 'cf-deco';  // botanical frame overlay
      frame.appendChild(deco);
      card.appendChild(frame); stage.appendChild(card);
      return card;
    });

    root.appendChild(viewport);

    const dotsWrap = document.createElement('div'); dotsWrap.className = 'cf-dots';
    const dots = items.map((_, i) => {
      const d = document.createElement('button');
      d.type = 'button'; d.className = 'cf-dot'; d.setAttribute('aria-label', 'video ' + (i + 1));
      d.addEventListener('click', () => animateTo(pos + wrap(i - pos)));
      dotsWrap.appendChild(d); return d;
    });
    root.appendChild(dotsWrap);

    const SPACING = portrait ? 0.9 : 0.72;   // × card width, gap between centres
    const ROT = 24, DEPTH = 120, WINDOW = 3.2;
    let pos = 0, anim = null, cardW = 0, lastActive = -1;

    function measure() {
      cardW = cards[0].offsetWidth;
      stage.style.height = cards[0].querySelector('.cf-frame').offsetHeight + 'px';
    }
    function wrap(x) { x = ((x % N) + N) % N; if (x > N / 2) x -= N; return x; }  // shortest looped distance

    function render(p) {
      pos = p;
      const spacing = cardW * SPACING;
      const cx = stage.clientWidth / 2;
      cards.forEach((card, i) => {
        const rel = wrap(i - p);
        const a = Math.abs(rel);
        if (a > WINDOW) { card.style.display = 'none'; return; }
        card.style.display = '';
        const clamped = Math.max(-1, Math.min(1, rel));
        const x = cx - cardW / 2 + rel * spacing;
        const scale = Math.max(0.68, 1 - a * 0.14);
        card.style.transform =
          `translate3d(${x.toFixed(1)}px, 0, ${(-a * DEPTH).toFixed(1)}px) rotateY(${(-clamped * ROT).toFixed(1)}deg) scale(${scale.toFixed(3)})`;
        card.style.opacity = Math.max(0, 1 - a * 0.32).toFixed(3);
        card.style.zIndex = String(Math.round(100 - a * 10));
        card.querySelector('.cf-veil').classList.toggle('open', a < 0.5);
      });
      const active = ((Math.round(p) % N) + N) % N;
      dots.forEach((d, i) => d.classList.toggle('active', i === active));
      if (cap) {
        cap.querySelector('.t').textContent = items[active].title || '';
        cap.querySelector('.d').textContent = items[active].caption || '';
      }
    }

    function pauseCard(card) {
      const f = card.querySelector('iframe');
      if (f && f.contentWindow) f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    }
    function settle() {
      const active = ((Math.round(pos) % N) + N) % N;
      if (active !== lastActive) {
        cards.forEach((card, i) => { if (i !== active) pauseCard(card); });  // stop the ones you left
        lastActive = active;
      }
    }
    function animateTo(target) {
      cancelAnimationFrame(anim);
      const start = pos, t0 = performance.now(), dur = 430;
      (function step(now) {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        render(start + (target - start) * e);
        if (k < 1) anim = requestAnimationFrame(step);
        else { render(target); settle(); }
      })(performance.now());
    }

    // keyboard: ← / → step through the focused carousel
    stage.tabIndex = 0;
    stage.setAttribute('role', 'group');
    stage.setAttribute('aria-label', portrait ? 'reels carousel' : 'videos carousel');
    stage.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')       { e.preventDefault(); animateTo(Math.round(pos) - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); animateTo(Math.round(pos) + 1); }
    });

    // trackpad: a horizontal two-finger swipe scrubs through the row,
    // then snaps to the nearest video when the swipe stops
    let wheelTO = null;
    stage.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // vertical intent → let the page scroll
      e.preventDefault();
      cancelAnimationFrame(anim);
      render(pos + e.deltaX / (cardW * SPACING));
      clearTimeout(wheelTO);
      wheelTO = setTimeout(() => animateTo(Math.round(pos)), 110);
    }, { passive: false });

    // drag (pointer events unify mouse + touch)
    let dragging = false, startX = 0, startPos = 0, moved = false;
    stage.addEventListener('pointerdown', (e) => {
      dragging = true; moved = false; startX = e.clientX; startPos = pos;
      cancelAnimationFrame(anim);
      stage.classList.add('dragging');
      stage.focus({ preventScroll: true });   // so arrow keys drive this row
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    });
    stage.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 5) moved = true;
      render(startPos - dx / (cardW * SPACING));
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false; stage.classList.remove('dragging');
      if (moved) { animateTo(Math.round(pos)); }
      else {
        const card = e.target.closest && e.target.closest('.cf-card');
        if (card) animateTo(pos + wrap(+card.dataset.i - pos));  // tap a side card → centre it
      }
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    window.addEventListener('resize', () => { measure(); render(pos); });
    measure(); render(0); settle();
    setTimeout(() => { measure(); render(pos); }, 300);   // re-measure after layout settles
  }

  coverflow(document.getElementById('cfWide'), document.getElementById('capWide'), WIDE);
  coverflow(document.getElementById('cfTall'), document.getElementById('capTall'), REELS);
</script>
<script src="assets/js/nav.js"></script>
</body>
